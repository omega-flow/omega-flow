version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is not yet supported by our toolchain: ts-jest needs the
      # JavaScript compiler API that TS 7 no longer exposes, and typescript-eslint
      # refuses to load against TS 7.0 (typescript-eslint/typescript-eslint#10940).
      # Minor and patch updates still come through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      production:
        dependency-type: production
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
